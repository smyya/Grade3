<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo — Sequence Game</title>
<style>
  :root{
    --bg:#161821;
    --panel:#1E212C;
    --ink:#EDEAE2;
    --muted:#8B8FA3;
    --ring:#2A2E3D;

    --c1:#E85D4B;  /* top */
    --c1-lit:#FF8267;
    --c2:#4FAE8C;  /* right */
    --c2-lit:#6FD8AF;
    --c3:#4B7FE8;  /* bottom */
    --c3-lit:#71A0FF;
    --c4:#D9A441;  /* left */
    --c4-lit:#F5C368;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  .header{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:2rem;
    margin:0;
    letter-spacing:0.5px;
  }
  h1 em{font-style:normal;color:var(--c2);}
  .stats{
    display:flex;
    gap:20px;
    font-variant-numeric:tabular-nums;
  }
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
  .stat b{font-size:1.35rem;font-family:Georgia,serif;}
  .stat small{opacity:0.6;font-size:0.72rem;}
  .subtitle{
    width:100%;
    max-width:520px;
    margin:0 0 30px;
    color:var(--muted);
    font-size:0.95rem;
  }

  .pad-wrap{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
  }
  .pad{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
    background:var(--ring);
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:6px;
    padding:6px;
  }
  .quad{
    border:none;
    cursor:pointer;
    filter:brightness(0.82);
    transition:filter 0.08s ease, transform 0.08s ease;
    padding:0;
  }
  .quad:disabled{cursor:default;}
  .quad.q1{background:var(--c1); border-radius:100% 0 0 0;}
  .quad.q2{background:var(--c2); border-radius:0 100% 0 0;}
  .quad.q4{background:var(--c4); border-radius:0 0 0 100%;}
  .quad.q3{background:var(--c3); border-radius:0 0 100% 0;}
  .quad.lit.q1{background:var(--c1-lit); filter:brightness(1.15); transform:scale(0.985);}
  .quad.lit.q2{background:var(--c2-lit); filter:brightness(1.15); transform:scale(0.985);}
  .quad.lit.q3{background:var(--c3-lit); filter:brightness(1.15); transform:scale(0.985);}
  .quad.lit.q4{background:var(--c4-lit); filter:brightness(1.15); transform:scale(0.985);}

  .center{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:34%;
    height:34%;
    border-radius:50%;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    box-shadow:inset 0 0 0 3px var(--bg);
    z-index:2;
    pointer-events:none;
  }
  .center b{
    font-family:Georgia,serif;
    font-size:1.9rem;
  }
  .center small{
    color:var(--muted);
    font-size:0.62rem;
    letter-spacing:0.4px;
    margin-top:2px;
  }

  .status{
    margin-top:26px;
    min-height:24px;
    font-size:1rem;
    color:var(--muted);
    text-align:center;
  }
  .status.alert{color:var(--c1-lit);}

  button.start{
    margin-top:18px;
    background:var(--c2);
    color:#0F1712;
    border:none;
    padding:12px 30px;
    font-size:0.98rem;
    font-family:inherit;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:0.3px;
    transition:background 0.2s ease, transform 0.1s ease;
  }
  button.start:hover{background:var(--c2-lit);}
  button.start:active{transform:scale(0.97);}
  button.start:disabled{
    opacity:0.4;
    cursor:default;
  }

  :focus-visible{
    outline:3px solid var(--c4);
    outline-offset:3px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Echo <em>Sequence</em></h1>
  <div class="stats">
    <div class="stat"><b id="level">0</b><small>ROUND</small></div>
    <div class="stat"><b id="best">0</b><small>BEST</small></div>
  </div>
</div>
<p class="subtitle">Watch the pattern light up, then repeat it back in the same order. Each round adds one more step.</p>

<div class="pad-wrap">
  <div class="pad" id="pad">
    <button class="quad q1" data-idx="0" aria-label="Red pad" disabled></button>
    <button class="quad q2" data-idx="1" aria-label="Green pad" disabled></button>
    <button class="quad q4" data-idx="3" aria-label="Yellow pad" disabled></button>
    <button class="quad q3" data-idx="2" aria-label="Blue pad" disabled></button>
  </div>
  <div class="center">
    <b id="centerText">?</b>
    <small>ROUND</small>
  </div>
</div>

<p class="status" id="status">Press start to begin.</p>
<button class="start" id="startBtn">Start</button>

<script>
(function(){
  const NOTES = [329.63, 261.63, 220.00, 174.61]; // E4, C4, A3, F3 — one tone per pad
  const padEls = Array.from(document.querySelectorAll('.quad'));
  const pads = [];
  padEls.forEach(el => { pads[parseInt(el.dataset.idx, 10)] = el; });
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');
  const centerText = document.getElementById('centerText');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  let audioCtx = null;
  let sequence = [];
  let playerStep = 0;
  let best = 0;
  let playing = false;
  let acceptingInput = false;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(idx, duration=0.35){
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = NOTES[idx];
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration + 0.02);
  }

  function litOn(idx){
    pads[idx].classList.add('lit');
  }
  function litOff(idx){
    pads[idx].classList.remove('lit');
  }

  function setPadsEnabled(enabled){
    pads.forEach(p => p.disabled = !enabled);
  }

  function sleep(ms){
    return new Promise(res => setTimeout(res, ms));
  }

  async function playSequence(){
    playing = true;
    acceptingInput = false;
    setPadsEnabled(false);
    statusEl.textContent = 'Watch closely…';
    statusEl.classList.remove('alert');
    await sleep(500);

    const speed = Math.max(260, 620 - sequence.length * 18);

    for(let i=0;i<sequence.length;i++){
      const idx = sequence[i];
      litOn(idx);
      playTone(idx);
      await sleep(speed * 0.62);
      litOff(idx);
      await sleep(speed * 0.38);
    }

    playing = false;
    acceptingInput = true;
    playerStep = 0;
    setPadsEnabled(true);
    statusEl.textContent = 'Your turn — repeat the pattern.';
  }

  function nextRound(){
    sequence.push(Math.floor(Math.random() * 4));
    levelEl.textContent = sequence.length;
    centerText.textContent = sequence.length;
    playSequence();
  }

  function handlePadPress(idx){
    if(!acceptingInput || playing) return;
    litOn(idx);
    playTone(idx, 0.22);
    setTimeout(()=>litOff(idx), 180);

    if(idx === sequence[playerStep]){
      playerStep++;
      if(playerStep === sequence.length){
        acceptingInput = false;
        setPadsEnabled(false);
        if(sequence.length > best){
          best = sequence.length;
          bestEl.textContent = best;
        }
        statusEl.textContent = 'Nice — next round coming up.';
        setTimeout(nextRound, 900);
      }
    } else {
      acceptingInput = false;
      setPadsEnabled(false);
      playing = false;
      statusEl.textContent = `Round broken at ${sequence.length}. Press start to try again.`;
      statusEl.classList.add('alert');
      centerText.textContent = '✕';
      startBtn.disabled = false;
      startBtn.textContent = 'Play again';
    }
  }

  padEls.forEach(p=>{
    p.addEventListener('click', ()=>handlePadPress(parseInt(p.dataset.idx,10)));
  });

  startBtn.addEventListener('click', ()=>{
    ensureAudio();
    sequence = [];
    playerStep = 0;
    levelEl.textContent = '0';
    centerText.textContent = '0';
    statusEl.classList.remove('alert');
    startBtn.disabled = true;
    startBtn.textContent = 'Playing…';
    nextRound();
  });
})();
</script>

</body>
</html>
