<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Times Table Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --ink: #1b1730;
    --paper: #fef8ec;
    --sun: #ffb703;
    --coral: #ff6b6b;
    --teal: #2ec4b6;
    --grape: #7048e8;
    --line: rgba(27,23,48,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 8% 15%, rgba(255,183,3,0.18) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(112,72,224,0.15) 0, transparent 40%);
    font-family: 'Fredoka', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 540px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .kicker {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--grape);
  }

  h1 {
    font-size: clamp(32px, 7vw, 44px);
    font-weight: 700;
    margin: 6px 0 4px;
    line-height: 1.05;
  }

  .sub {
    font-size: 15px;
    color: rgba(27,23,48,0.65);
    max-width: 380px;
    margin: 0 auto;
  }

  /* ---- Setup screen ---- */
  .card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 28px 26px;
  }

  .mode-row {
    display: flex;
    gap: 10px;
    margin: 4px 0 22px;
  }

  .mode-btn {
    flex: 1;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 8px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    text-align: center;
  }

  .mode-btn.active {
    background: var(--grape);
    color: #fff;
  }

  .mode-panel {
    margin-bottom: 22px;
  }

  .field-label {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: rgba(27,23,48,0.6);
    margin-bottom: 10px;
    text-align: center;
  }

  .single-select-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'Space Mono', monospace;
  }

  .single-select-row select {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    padding: 8px 14px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
  }

  .table-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .table-toggle {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    user-select: none;
  }

  .table-toggle.active {
    background: var(--teal);
    color: #fff;
  }

  .table-hint {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: rgba(27,23,48,0.5);
    text-align: center;
    margin-top: 10px;
  }

  .count-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    padding: 9px 16px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .chip.active {
    background: var(--sun);
  }

  .chip:hover { transform: translateY(-2px); }

  .go-btn {
    display: block;
    width: 100%;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    padding: 15px;
    background: var(--coral);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .go-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }

  /* ---- Quiz screen ---- */
  .progress-track {
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.3s ease;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: rgba(27,23,48,0.6);
    margin-bottom: 6px;
  }

  .problem {
    text-align: center;
    font-size: clamp(48px, 13vw, 68px);
    font-weight: 700;
    margin: 20px 0 6px;
    letter-spacing: -0.01em;
  }

  .problem .op {
    color: var(--grape);
    margin: 0 14px;
  }

  .answer-display {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 58px;
    margin: 18px 0 16px;
    font-family: 'Space Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--paper);
  }

  .answer-display .cursor {
    color: var(--teal);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .key {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    padding: 14px 0;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .key:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  .key-wide {
    font-size: 15px;
    background: var(--paper);
  }

  .submit-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 18px;
    padding: 13px 22px;
    background: var(--teal);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
  }

  .submit-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  .check-btn {
    width: 100%;
  }

  .feedback {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    min-height: 22px;
    margin-top: 14px;
  }

  .feedback.correct { color: #1b8a5a; }
  .feedback.wrong { color: var(--coral); }

  /* ---- Results screen ---- */
  .score-big {
    text-align: center;
    font-size: 64px;
    font-weight: 700;
    margin: 6px 0 2px;
  }

  .score-label {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: rgba(27,23,48,0.6);
    margin-bottom: 24px;
  }

  .miss-list {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    border-top: 2px dashed var(--line);
    padding-top: 16px;
    margin-bottom: 22px;
  }

  .miss-list .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }

  .miss-list .empty {
    text-align: center;
    color: rgba(27,23,48,0.5);
  }

  .again-btn {
    display: block;
    width: 100%;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 18px;
    padding: 14px;
    background: var(--sun);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
  }

  .again-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <p class="sub">Practice multiplication from 1 to 10.</p>
  </header>

  <!-- SETUP -->
  <div class="card" id="setup-screen">
    <div class="mode-row">
      <div class="mode-btn active" id="mode-single-btn">One table</div>
      <div class="mode-btn" id="mode-mixed-btn">Mixed tables</div>
    </div>

    <div class="mode-panel" id="single-panel">
      <div class="field-label">Practice the</div>
      <div class="single-select-row">
        <select id="single-select"></select>
        <span>table</span>
      </div>
    </div>

    <div class="mode-panel hidden" id="mixed-panel">
      <div class="field-label">Pick the tables to mix</div>
      <div class="table-grid" id="table-grid"></div>
      <div class="table-hint" id="table-hint">Tap the numbers you want to practice.</div>
    </div>

    <div class="count-row" id="count-row">
      <div class="chip" data-count="5">5 problems</div>
      <div class="chip active" data-count="10">10 problems</div>
      <div class="chip" data-count="15">15 problems</div>
    </div>
    <button class="go-btn" id="start-btn">Start practicing</button>
  </div>

  <!-- QUIZ -->
  <div class="card hidden" id="quiz-screen">
    <div class="meta-row">
      <span id="progress-text">Problem 1 of 20</span>
      <span id="score-text">Correct: 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="problem" id="problem-text"></div>

    <div class="answer-display" id="answer-display"><span id="answer-value"></span><span class="cursor">|</span></div>

    <div class="keypad" id="keypad">
      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key key-wide" id="clear-key">Clear</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key key-wide" id="backspace-key">&larr;</button>
    </div>
    <button type="button" class="submit-btn check-btn" id="check-btn">Check</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="results-screen">
    <div class="score-big" id="score-big">0/0</div>
    <div class="score-label" id="score-sub">correct</div>
    <div class="miss-list" id="miss-list"></div>
    <button class="again-btn" id="again-btn">Practice again</button>
  </div>
</div>

<script>
  const setupScreen = document.getElementById('setup-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const resultsScreen = document.getElementById('results-screen');

  // --- Mode toggle ---
  let mode = 'single'; // 'single' | 'mixed'
  const modeSingleBtn = document.getElementById('mode-single-btn');
  const modeMixedBtn = document.getElementById('mode-mixed-btn');
  const singlePanel = document.getElementById('single-panel');
  const mixedPanel = document.getElementById('mixed-panel');

  modeSingleBtn.addEventListener('click', () => {
    mode = 'single';
    modeSingleBtn.classList.add('active');
    modeMixedBtn.classList.remove('active');
    singlePanel.classList.remove('hidden');
    mixedPanel.classList.add('hidden');
  });

  modeMixedBtn.addEventListener('click', () => {
    mode = 'mixed';
    modeMixedBtn.classList.add('active');
    modeSingleBtn.classList.remove('active');
    mixedPanel.classList.remove('hidden');
    singlePanel.classList.add('hidden');
  });

  // --- Single table select (0-10) ---
  const singleSelect = document.getElementById('single-select');
  for (let i = 1; i <= 10; i++) {
    singleSelect.add(new Option(i, i));
  }
  singleSelect.value = 5;

  // --- Mixed table grid (1-10) ---
  const tableGrid = document.getElementById('table-grid');
  const tableHint = document.getElementById('table-hint');
  const selectedTables = new Set();

  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('div');
    btn.className = 'table-toggle';
    btn.textContent = i;
    btn.dataset.value = i;
    btn.addEventListener('click', () => {
      if (selectedTables.has(i)) {
        selectedTables.delete(i);
        btn.classList.remove('active');
      } else {
        selectedTables.add(i);
        btn.classList.add('active');
      }
    });
    tableGrid.appendChild(btn);
  }

  let questionCount = 10;
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      questionCount = parseInt(chip.dataset.count, 10);
    });
  });

  let problems = [];
  let currentIndex = 0;
  let correctCount = 0;
  let misses = [];

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Builds `count` problems from the given list of "a" values, each paired
  // with every b from 1-10. Guarantees no repeated question within a session
  // as long as count <= number of unique combinations; cycles through a
  // freshly-shuffled set of combos if more are needed than exist.
  function buildProblems(aValues, count) {
    const combos = [];
    aValues.forEach(a => {
      for (let b = 1; b <= 10; b++) combos.push({ a, b });
    });

    const result = [];
    while (result.length < count) {
      const batch = shuffle(combos.slice());
      // avoid a duplicate landing right at the seam between batches
      if (result.length > 0 && batch.length > 1) {
        const prev = result[result.length - 1];
        if (batch[0].a === prev.a && batch[0].b === prev.b) {
          [batch[0], batch[1]] = [batch[1], batch[0]];
        }
      }
      result.push(...batch);
    }
    return result.slice(0, count);
  }  document.getElementById('start-btn').addEventListener('click', () => {
    if (mode === 'single') {
      const table = parseInt(singleSelect.value, 10);
      problems = buildProblems([table], questionCount);
    } else {
      if (selectedTables.size === 0) {
        tableHint.textContent = 'Pick at least one table to start.';
        tableHint.style.color = 'var(--coral)';
        return;
      }
      tableHint.style.color = '';
      problems = buildProblems(Array.from(selectedTables), questionCount);
    }

    currentIndex = 0;
    correctCount = 0;
    misses = [];

    setupScreen.classList.add('hidden');
    resultsScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');

    showProblem();
  });

  const problemText = document.getElementById('problem-text');
  const progressText = document.getElementById('progress-text');
  const scoreText = document.getElementById('score-text');
  const progressFill = document.getElementById('progress-fill');
  const answerValue = document.getElementById('answer-value');
  const feedback = document.getElementById('feedback');
  const keypad = document.getElementById('keypad');
  const checkBtn = document.getElementById('check-btn');

  let currentAnswer = '';
  let locked = false; // true while feedback is showing, blocks further input

  function renderAnswer() {
    answerValue.textContent = currentAnswer;
  }

  function showProblem() {
    const p = problems[currentIndex];
    problemText.innerHTML = `${p.a}<span class="op">&times;</span>${p.b}`;
    progressText.textContent = `Problem ${currentIndex + 1} of ${problems.length}`;
    scoreText.textContent = `Correct: ${correctCount}`;
    progressFill.style.width = `${(currentIndex / problems.length) * 100}%`;
    feedback.textContent = '';
    feedback.className = 'feedback';
    currentAnswer = '';
    locked = false;
    renderAnswer();
  }

  keypad.addEventListener('click', (e) => {
    const key = e.target.closest('.key');
    if (!key || locked) return;

    if (key.id === 'clear-key') {
      currentAnswer = '';
    } else if (key.id === 'backspace-key') {
      currentAnswer = currentAnswer.slice(0, -1);
    } else if (key.dataset.digit !== undefined) {
      if (currentAnswer.length < 3) {
        currentAnswer += key.dataset.digit;
      }
    }
    renderAnswer();
  });

  function checkAnswer() {
    if (locked) return;
    const p = problems[currentIndex];
    const correctAnswer = p.a * p.b;
    const given = currentAnswer === '' ? NaN : parseInt(currentAnswer, 10);

    locked = true;

    if (given === correctAnswer) {
      correctCount++;
      feedback.textContent = 'Correct!';
      feedback.className = 'feedback correct';
    } else {
      misses.push({ a: p.a, b: p.b, correct: correctAnswer, given: isNaN(given) ? '—' : given });
      feedback.textContent = `Not quite — ${p.a} × ${p.b} = ${correctAnswer}`;
      feedback.className = 'feedback wrong';
    }

    currentIndex++;
    setTimeout(() => {
      if (currentIndex < problems.length) {
        showProblem();
      } else {
        showResults();
      }
    }, given === correctAnswer ? 500 : 1100);
  }

  checkBtn.addEventListener('click', checkAnswer);

  function showResults() {
    quizScreen.classList.add('hidden');
    resultsScreen.classList.remove('hidden');

    document.getElementById('score-big').textContent = `${correctCount}/${problems.length}`;
    const pct = Math.round((correctCount / problems.length) * 100);
    document.getElementById('score-sub').textContent = `correct — ${pct}%`;

    const missList = document.getElementById('miss-list');
    if (misses.length === 0) {
      missList.innerHTML = '<div class="empty">Perfect score. Every fact landed.</div>';
    } else {
      missList.innerHTML = misses.map(m =>
        `<div class="row"><span>${m.a} × ${m.b}</span><span>you said ${m.given}, answer is ${m.correct}</span></div>`
      ).join('');
    }
  }

  document.getElementById('again-btn').addEventListener('click', () => {
    resultsScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });
</script>

</body>
</html>
